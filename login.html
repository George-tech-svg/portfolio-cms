<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg-gradient); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 1.5rem; }
        .login-container { width: 100%; max-width: 420px; }
        .login-box {
            background: var(--bg-card);
            padding: 2.5rem 2rem;
            border-radius: 24px;
            box-shadow: var(--shadow-xl);
            border: 1px solid var(--border-color);
            transition: var(--transition);
        }
        .login-box:hover { transform: translateY(-4px); box-shadow: 0 30px 80px rgba(99,102,241,0.15); }
        .logo { text-align: center; font-size: 2.8rem; font-weight: 900; display: block; margin-bottom: 0.25rem; color: var(--text-primary); text-decoration: none; }
        .logo span { background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
        h1 { text-align: center; font-size: 1.8rem; font-weight: 800; margin-bottom: 0.3rem; color: var(--text-primary); }
        .subtitle { text-align: center; color: var(--text-secondary); margin-bottom: 2rem; font-size: 0.95rem; }
        .form-group { margin-bottom: 1.25rem; }
        .form-group label { display: block; font-weight: 600; margin-bottom: 0.4rem; font-size: 0.9rem; color: var(--text-primary); }
        .input-wrapper { position: relative; }
        .input-wrapper i { position: absolute; left: 1rem; top: 50%; transform: translateY(-50%); color: var(--text-light); font-size: 1rem; }
        .input-wrapper input { width: 100%; padding: 0.9rem 1rem 0.9rem 3rem; border: 2px solid var(--border-color); border-radius: 12px; background: var(--bg-primary); color: var(--text-primary); font-size: 1rem; transition: var(--transition); font-family: inherit; }
        .input-wrapper input:focus { outline: none; border-color: var(--accent-primary); box-shadow: 0 0 0 4px rgba(99,102,241,0.1); }
        .toggle-password { position: absolute; right: 1rem; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--text-light); cursor: pointer; font-size: 1.1rem; padding: 0; transition: var(--transition); }
        .toggle-password:hover { color: var(--accent-primary); }
        .login-error { background: #ef4444; color: white; padding: 0.8rem 1rem; border-radius: 12px; margin-bottom: 1.5rem; display: none; font-size: 0.9rem; align-items: center; gap: 0.5rem; }
        .login-error.show { display: flex; }
        .btn-block { width: 100%; justify-content: center; padding: 1rem; font-size: 1.05rem; }
        .btn { display: inline-flex; align-items: center; gap: 0.6rem; padding: 0.9rem 2.2rem; border-radius: 50px; text-decoration: none; font-weight: 600; font-size: 1rem; transition: var(--transition); border: none; cursor: pointer; }
        .btn.primary { background: var(--accent-gradient); color: white; box-shadow: 0 4px 20px rgba(99,102,241,0.3); }
        .btn.primary:hover { transform: translateY(-3px); box-shadow: 0 8px 40px rgba(99,102,241,0.4); }
        .back-link { display: block; text-align: center; margin-top: 1.5rem; color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; transition: var(--transition); }
        .back-link:hover { color: var(--accent-primary); }
        .login-footer { text-align: center; margin-top: 1.5rem; padding-top: 1.5rem; border-top: 1px solid var(--border-color); font-size: 0.8rem; color: var(--text-light); }
    </style>
</head>
<body>
<div class="login-container">
    <div class="login-box">
        <a href="#" class="logo">Dev<span>.</span></a>
        <h1>Welcome Back</h1>
        <p class="subtitle">Login to manage your portfolio</p>
        <div id="loginError" class="login-error"><i class="fas fa-exclamation-circle"></i> <span id="errorMsg">Invalid username or password</span></div>
        <form id="loginForm" autocomplete="off">
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <i class="fas fa-user"></i>
                    <input type="text" id="username" placeholder="Enter username" required autofocus>
                </div>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <i class="fas fa-lock"></i>
                    <input type="password" id="password" placeholder="Enter password" required>
                    <button type="button" class="toggle-password" aria-label="Toggle password visibility">
                        <i class="fas fa-eye"></i>
                    </button>
                </div>
            </div>
            <button type="submit" class="btn primary btn-block"><i class="fas fa-sign-in-alt"></i> Login</button>
        </form>
        <a href="register.html" class="back-link"><i class="fas fa-user-plus"></i> Register as Admin</a>
        <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Portfolio</a>
        <div class="login-footer">Secure admin login</div>
    </div>
</div>

<script src="js/config.js"></script>
    <script src="js/api.js"></script>
<script>
    const API_BASE = window.PortfolioAPI.baseURL;

    document.querySelectorAll('.toggle-password').forEach(btn => {
        btn.addEventListener('click', function() {
            const input = this.closest('.input-wrapper').querySelector('input');
            const icon = this.querySelector('i');
            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        });
    });

    document.getElementById('loginForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        const username = document.getElementById('username').value.trim();
        const password = document.getElementById('password').value;
        const errorDiv = document.getElementById('loginError');
        const errorMsg = document.getElementById('errorMsg');

        try {
            const res = await PortfolioAPI.fetch(`${API_BASE}/api/login`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, password })
            });
            const data = await res.json();

            if (data.success) {
                localStorage.setItem('token', data.token);
                localStorage.setItem('user', JSON.stringify(data.user));
                window.location.href = 'admin.html';
            } else {
                errorMsg.textContent = data.error || 'Login failed';
                errorDiv.classList.add('show');
                setTimeout(() => errorDiv.classList.remove('show'), 4000);
            }
        } catch (err) {
            errorMsg.textContent = 'Network error – check your connection.';
            errorDiv.classList.add('show');
            setTimeout(() => errorDiv.classList.remove('show'), 4000);
        }
    });
</script>
</body>
</html>
